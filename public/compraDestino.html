<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compra</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/elements.css">
  <link rel="stylesheet" href="css/compraDestino.css">
</head>
<body>
  <header class="header-app">
    <nav class="logo-pay">
      <a href="#">
        <img src="img/PAWPrints.svg" alt="Mi sitio">
      </a> 
    </nav>
  </header>
	<main>
    <section class="details-pay">
      <h2>Detalles de mi compra</h2>
      <table>
        <tr>
          <th></th>
          <th>$123123</th>
        </tr>
        <tr>
          <td>Libro1</td>
          <td>$23123</td>
        </tr>
        <tr>
          <td>Libro2</td>
          <td>$100000</td>
        </tr>
      </table>
      <p>$$$</p>
    </section>
    <form class="form-checkout" action="destinatario.php" method="POST">
      <fieldset class="fieldset-checkout">
        <legend class="legend-checkout">Datos del destinatario</legend>
    
        <label for="nombre">Nombre</label>
        <input class="form-input-text" type="text" id="nombre" name="nombre" placeholder="Nombre" required>
    
        <label for="apellido">Apellido</label>
        <input class="form-input-text" type="text" id="apellido" name="apellido" placeholder="Apellido" required>
    
        <label for="telefono">Teléfono</label>
        <input class="form-input-text" type="tel" id="telefono" name="telefono" placeholder="Teléfono" required>
    
        <label for="codigoPostal">Código postal</label>
        <input class="form-input-text" type="text" id="codigoPostal" name="codigoPostal" placeholder="Código postal" required>
    
        <label for="calle">Calle</label>
        <input class="form-input-text" type="text" id="calle" name="calle" placeholder="Calle" required>
    
        <label for="numero">Número</label>
        <input class="form-input-text" type="text" id="numero" name="numero" placeholder="Número" required>
    
        <label for="departamento">Departamento</label>
        <input class="form-input-text" type="text" id="departamento" name="departamento" placeholder="Departamento (opcional)">
    
        <label for="barrio">Barrio</label>
        <input class="form-input-text" type="text" id="barrio" name="barrio" placeholder="Barrio (opcional)">
    
        <label for="ciudad">Ciudad</label>
        <input class="form-input-text" type="text" id="ciudad" name="ciudad" placeholder="Ciudad" required>
      </fieldset>
    
      <fieldset class="fieldset-checkout">
        <legend class="legend-checkout">Datos de facturación</legend>
        <label for="dni">DNI o CUIT</label>
        <input class="form-input-text" type="text" id="dni" name="dni" placeholder="DNI o CUIT" required>
      </fieldset>
    
      <input type="submit" class="button-submit" value="Continuar con el pago">
    </form>
  </main>
</body>
</html>
