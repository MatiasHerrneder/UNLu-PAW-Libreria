<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compra</title>
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/elements.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/compraDestino.css">
  <link rel="stylesheet" href="css/medioPago.css">
</head>
<body>
  <header class="header-app">
    <nav class="logo-pay">
      <a href="#">
        <img src="img/PAWPrints.svg" alt="Mi sitio">
      </a> 
    </nav>
  </header>
  <main>
    <h1 class="title-cobro">Pagina de cobro</h1>
    <section class="details-pay">
      <h2>Detalles de mi compra</h2>
      <table>
        <tr>
          <th></th>
          <th>$123123</th>
        </tr>
        <tr>
          <td>Libro1</td>
          <td>$23123</td>
        </tr>
        <tr>
          <td>Libro2</td>
          <td>$100000</td>
        </tr>
      </table>
      <p>$$$</p>
    </section>
    <section class="contact-send">
      <h2>Información de contacto y envío</h2>
      <section>
        <section class="mail-box">
          <img src="img/mail.png" alt="Mi correo" class="mail-icon">
          <p><strong>correo@example.com</strong></p>
        </section>
        <section class="location-box">
          <img src="img/location.png" alt="Mi ubicación" class="location-icon">
          <section>  
            <p>Dirección</p>
            <p>Código postal</p>
            <p>Ciudad</p>
            <p>Teléfono</p>
          </section>
          <a href="compraDestino.html">Cambiar</a>
        </section>
      </section>
    </section>
    <section>
      <form action="realizar-pedido.php" method="POST">
        <legend>Medio de pago</legend>
        <label for="tarjeta">Número de tarjeta</label>
        <input class="input-text" type="text" id="tarjeta" name="tarjeta" placeholder="Número de tarjeta" required>

        <label for="titular">Titular de la tarjeta</label>
        <input class="input-text" type="text" id="titular" name="titular" placeholder="Titular de la tarjeta" required>
        <div class="tarjeta-wrapper">
          <label for="vencimiento">Vencimiento (MM/AA)</label>
          <input class="input-text" type="text" id="vencimiento" name="vencimiento" placeholder="MM/AA" required>
          
          <label for="cvv">CVV</label>
          <input class="input-text" type="text" id="cvv" name="cvv" placeholder="CVV" required>
        </div>
        <label for="cuotas">Cuotas</label>
        <select id="cuotas" name="cuotas" required>
          <option value="">Seleccionar</option>
          <option value="1">1 cuota</option>
          <option value="3">3 cuotas</option>
          <option value="6">6 cuotas</option>
          <option value="12">12 cuotas</option>
        </select>

        <label for="tipo-doc">Tipo documento</label>
        <select id="tipo-doc" name="tipo-doc" required>
          <option value="">Seleccionar</option>
          <option value="dni">DNI</option>
          <option value="cuit">CUIT</option>
        </select>

        <label for="doc">Documento</label>
        <input class="input-text" type="text" id="doc" name="doc" placeholder="Documento (el anterior default)" required>

        <label for="telefono">Teléfono</label>
        <input class="input-text" type="text" id="telefono" name="telefono" placeholder="Teléfono (el anterior default)" required>

        <input type="submit" class="button-submit" value="Realizar pedido">
      </form>
    </section>
  </main>
</body>
</html>
