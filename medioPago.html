<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Compra</title>
</head>
<body>
  <header>
    <nav>
      <a href="#" class="logo">
        <img src="logo.png" alt="Mi sitio">
      </a> 
    </nav>
  </header>
  <main>
    <h1>Pagina de cobro</h1>
    <section>
      <h2>Detalles de mi compra</h2>
      <table>
        <tr>
          <th></th>
          <th>$123123</th>
        </tr>
        <tr>
          <td>Libro1</td>
          <td>$23123</td>
        </tr>
        <tr>
          <td>Libro2</td>
          <td>$100000</td>
        </tr>
      </table>
    </section>
    <section>
      <h2>Información de contacto y envío</h2>
      <section>
        <section>
          <img src="mail.png" alt="Mi correo">
          <p><strong>correo@example.com</strong></p>
        </section>
        <section>
          <img src="location.png" alt="Mi ubicación">
            <p>Dirección</p>
            <p>Código postal</p>
            <p>Ciudad</p>
            <p>Teléfono</p>
          <a href="compraDestino.html">Cambiar</a>
        </section>
      </section>
    </section>
    <section>
      <h2>Medio de pago</h2>

      <form action="realizar-pedido.php" method="POST">

        <label for="tarjeta">Número de tarjeta</label>
        <input type="text" id="tarjeta" name="tarjeta" placeholder="Número de tarjeta" required>

        <label for="titular">Titular de la tarjeta</label>
        <input type="text" id="titular" name="titular" placeholder="Titular de la tarjeta" required>

        <label for="vencimiento">Vencimiento (MM/AA)</label>
        <input type="text" id="vencimiento" name="vencimiento" placeholder="MM/AA" required>
        
        <label for="cvv">CVV</label>
        <input type="text" id="cvv" name="cvv" placeholder="CVV" required>

        <label for="cuotas">Cuotas</label>
        <select id="cuotas" name="cuotas" required>
          <option value="">Seleccionar</option>
          <option value="1">1 cuota</option>
          <option value="3">3 cuotas</option>
          <option value="6">6 cuotas</option>
          <option value="12">12 cuotas</option>
        </select>

        <label for="tipo-doc">Tipo documento</label>
        <select id="tipo-doc" name="tipo-doc" required>
          <option value="">Seleccionar</option>
          <option value="dni">DNI</option>
          <option value="cuit">CUIT</option>
        </select>

        <label for="doc">Documento</label>
        <input type="text" id="doc" name="doc" placeholder="Documento (el anterior default)" required>

        <label for="telefono">Teléfono</label>
        <input type="text" id="telefono" name="telefono" placeholder="Teléfono (el anterior default)" required>

        <input type="submit" value="Realizar pedido">
      </form>
    </section>
  </main>
</body>
</html>
